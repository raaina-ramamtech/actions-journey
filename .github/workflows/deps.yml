name: deps
on: push
jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - name: check out repo
        uses: actions/checkout-repo@v4
      - name: cache pip download
        uses: actions/cache@v4
        with:
          path: ~/.cache/pio
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-
      - name: Install requirements
        run: pip install -r requirements.txt

name: Testing pipeline
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{steps.ver.outputs.version}}
    steps:
      - name: Compute version
        id: ver
        run: echo "version=1.2.4" >> "$GITHUB_OUTPUT"
  test:
    runs-on: ubuntu-latest
    needs: build
  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - run: echo "Deploying ${{ needs.build.outputs.version }}"

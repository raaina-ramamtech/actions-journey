name: inspect
on: push
jobs:
  ins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Print kernel details
        run: |
          uname -a
          ls
      - name: Print file count
        run: ls | wc -l
      - name: Describe this run
        run: |
          echo "Repository: ${{github.repository}}"
          echo "ref: ${{github.ref}}"
          echo "sha: ${{github.sha}}"
          echo "event: ${{github.event}}"
          echo "actorr: ${{github.actor}}"
